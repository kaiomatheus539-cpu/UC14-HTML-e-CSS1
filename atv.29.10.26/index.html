
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Sistema de Notas</h1>
            <p class="descricao">
                Consulte a média e a situação acadêmica do estudante.
            </p>

            <form id="formNotas">
                <label for="nome">Nome do estudante</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome completo"
                >

                <div class="notas">
                    <div>
                        <label for="nota1">Nota 1</label>
                        <input type="number" id="nota1"
                            min="0" max="10" step="any"
                            placeholder="0 a 10">
                    </div>

                    <div>
                        <label for="nota2">Nota 2</label>
                        <input type="number" id="nota2"
                            min="0" max="10" step="any"
                            placeholder="0 a 10">
                    </div>

                    <div>
                        <label for="nota3">Nota 3</label>
                        <input type="number" id="nota3"
                            min="0" max="10" step="any"
                            placeholder="0 a 10">
                    </div>
                </div>

                <button type="submit" class="btn-calcular">
                    Calcular média
                </button>

                <button type="button" id="limpar"
                    class="btn-limpar">
                    Reiniciar consulta
                </button>
            </form>

            <div id="resultado" class="resultado"
                aria-live="polite" hidden>
            </div>
        </section>
    </main>
</body>
</html>
